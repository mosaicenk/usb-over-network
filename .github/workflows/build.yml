name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  mingw:
    name: MinGW build + tests (warnings as errors)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
      - name: Build CLI + GUI (-Werror)
        run: mingw32-make CC=gcc all
      - name: Build & run protocol tests
        run: mingw32-make CC=gcc test
